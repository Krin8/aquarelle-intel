<svg viewBox="0 0 100 100" fill="none" stroke="black" xmlns="http://www.w3.org/2000/svg">
  <!-- Square border -->
  <rect x="5" y="5" width="90" height="90" stroke-width="10" />
  
  <defs>
    <!-- Mask for the '^' left leg (knocked out by 'V' left leg) -->
    <mask id="mask-caret-left">
      <rect width="100" height="100" fill="white" />
      <line x1="10" y1="10" x2="50" y2="90" stroke="black" stroke-width="20" />
    </mask>

    <!-- Mask for the 'V' right leg (knocked out by '^' right leg) -->
    <mask id="mask-v-right">
      <rect width="100" height="100" fill="white" />
      <line x1="50" y1="10" x2="90" y2="90" stroke="black" stroke-width="20" />
    </mask>
  </defs>

  <line x1="10" y1="90" x2="50" y2="10" stroke-width="10" mask="url(#mask-caret-left)" />
  <line x1="10" y1="10" x2="50" y2="90" stroke-width="10" />
  <line x1="50" y1="10" x2="90" y2="90" stroke-width="10" />
  <line x1="90" y1="10" x2="50" y2="90" stroke-width="10" mask="url(#mask-v-right)" />
</svg>
